name: pytest check and post coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # The current leg keeps the existing check name so rules that match it still apply.
    name: ${{ matrix.name }}
    if: >-
      !(github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'dependencies') ||
      github.event.pull_request.user.type == 'Bot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current Home Assistant from uv.lock with pytest-homeassistant. Posts coverage.
          - name: pytest check and post coverage
            ha-version: current
          # Minimum supported Home Assistant, read from hacs.json.
          - name: pytest Home Assistant minimum
            ha-version: minimum

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Debug GitHub Variables
        run: |
            echo "github.event_name: ${{ github.event_name }}"
            echo "github.ref_name: ${{ github.ref_name }}"
            echo "github.event.repository.default_branch: ${{ github.event.repository.default_branch }}"
            echo "github.event.pull_request.user.type: ${{ github.event.pull_request.user.type }}"
            echo "PR labels: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '' }}"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Verify current test environment
        if: matrix.ha-version == 'current'
        run: >-
          uv run --python ">=3.14.2,<3.15" --locked --group pytest
          python .github/scripts/minimum_ha_test_env.py verify

      - name: Run pytest from the lock
        if: matrix.ha-version == 'current'
        run: uv run --python ">=3.14.2,<3.15" --locked --group pytest pytest

      - name: Install minimum Home Assistant test environment
        if: matrix.ha-version == 'minimum'
        # Resolve the oldest Home Assistant and test plugin release that satisfy the
        # hacs.json minimum, then install only those two pins with the pytest-base
        # group. --no-config ignores [tool.uv] so dependency constraints added there
        # for current Home Assistant cannot conflict with the older release's pins.
        # This environment is only used for tests.
        run: |
          uv venv --python ">=3.14.2,<3.15"
          python3 .github/scripts/minimum_ha_test_env.py requirements > "${RUNNER_TEMP}/ha-min.in"
          uv pip compile --quiet --no-config --python .venv/bin/python --resolution lowest-direct \
            --no-header --output-file "${RUNNER_TEMP}/ha-min.txt" "${RUNNER_TEMP}/ha-min.in"
          grep -E '^(homeassistant|pytest-homeassistant(-custom-component)?)==' \
            "${RUNNER_TEMP}/ha-min.txt" > "${RUNNER_TEMP}/ha-min-pins.txt"
          cat "${RUNNER_TEMP}/ha-min-pins.txt"
          uv pip install --no-config --python .venv/bin/python --group pytest-base \
            --requirements "${RUNNER_TEMP}/ha-min-pins.txt"

      - name: Verify minimum test environment
        if: matrix.ha-version == 'minimum'
        run: >-
          .venv/bin/python .github/scripts/minimum_ha_test_env.py verify
          --pins "${RUNNER_TEMP}/ha-min-pins.txt"

      - name: Run pytest on minimum Home Assistant
        if: matrix.ha-version == 'minimum'
        run: .venv/bin/python -m pytest

      - name: Generate coverage comment data
        if: matrix.ha-version == 'current' && github.event_name == 'pull_request'
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.6
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: process_pr
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Store PR coverage comment
        if: >-
          matrix.ha-version == 'current' &&
          steps.coverage_comment.outputs.comment_file_written == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
          retention-days: 1

      - name: Store coverage data for trusted publication
        if: matrix.ha-version == 'current' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-data
          path: .coverage
          include-hidden-files: true
          retention-days: 1
